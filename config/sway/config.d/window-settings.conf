# Blur Settings
for_window [class=".*"] blur enable
for_window [class=".*"] opacity 0.84
for_window [class=".*"] dim_inactive 0.2
for_window [class=".*"] blur_saturation 1.1
for_window [class=".*"] blur_contrast 1.5
for_window [class=".*"] blur_radius 10

# Border Settings
default_border pixel
for_window [floating] border pixel 2, corner_radius 0

# Misc window popup Settings
for_window [app_id="xdg-desktop-portal-gtk"] floating enable
# How to determine the resize and move position coordinates: let width and height of screen be w px & h px, resize set ≈ [45%ofx]px [55%ofy]px, move position ≈ [x-(45%ofx)-10]px [5]px
for_window [app_id="clipse-popup"] blur_xray enable, floating enable, resize set 610 px 422 px, move position 746 px 5 px
for_window [app_id="bluetui-popup"] blur_xray enable, floating enable, resize set 610 px 422 px, move position 746 px 5 px
for_window [app_id="wiremix-popup"] blur_xray enable, floating enable, resize set 610 px 422 px, move position 746 px 5 px
for_window [app_id="nmtui-go-popup"] blur_xray enable, floating enable, resize set 610 px 422 px, move position 746 px 5 px

# Layer shell Settings
layer_effects "rofi" {
    blur enable;
    corner_radius 11;
}

layer_effects "swayosd" {
    blur enable;
    corner_radius 7;
}
